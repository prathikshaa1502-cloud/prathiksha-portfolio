<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111014" />
    <meta name="description" content="Prathiksha A — a creative builder exploring the intersections of technology, creativity, data, and research." />
    <title>Prathiksha A — Ideas in Motion</title>
  </head>
  <body>
    <!-- Netlify Forms detection form. Keep this in the built HTML so Netlify can register the form. -->
    <form name="portfolio-contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="portfolio-contact" />
      <input name="name" />
      <input name="email" />
      <input name="purpose" />
      <textarea name="message"></textarea>
      <p hidden><label>Leave this empty: <input name="bot-field" /></label></p>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
